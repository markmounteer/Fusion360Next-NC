name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-interoperability:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: markmounteer/LinuxCNCNext-NC
          ref: 41e89aadee32d590bb12f8e82b03e051dbdbe5b5
          path: .cache/native-translator
          persist-credentials: false
      - run: rustup toolchain install 1.96.1 --profile minimal
      - run: cargo build --locked
        working-directory: .cache/native-translator
      - run: npm run check:build
      - run: npm run test:native-translator
        env:
          NEXTNC_NATIVE_ROOT: .cache/native-translator
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check:build
      - run: npm test
      - name: Check out pinned LinuxCNC translator for interoperability tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: markmounteer/LinuxCNCNext-NC
          ref: 6ada457997eb9dba83edffcf68df99e99a68e25f
          path: .cache/translator
          persist-credentials: false
      - run: npm run test:translator
        env:
          LINUXCNC_NEXTNC: .cache/translator
      - run: npm run example
      - run: git diff --exit-code -- examples/turning.stpnc
  windows-diagnostics:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test collector with Windows PowerShell 5.1
        shell: powershell
        run: ./test/collector.test.ps1
